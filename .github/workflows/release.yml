name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Créer une GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (historique complet pour le changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Générer le changelog depuis le tag précédent
        id: changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS" ]; then
            CHANGES=$(git log "${PREVIOUS}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "CHANGES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changements

            ${{ steps.changelog.outputs.CHANGES }}

            ---
            *Généré automatiquement par GitHub Actions*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
