<template data-composition-id="03-product-intro">

<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');

/* ── Root sizing + container-type (required for cqw units) ── */
#root {
  width: 1920px;
  height: 1080px;
  position: relative;
  overflow: hidden;
  container-type: size;
  font-family: 'Instrument Sans', sans-serif;
}

/* ── Navy background layer (never painted on #root) ── */
.pi-bg {
  position: absolute;
  inset: 0;
  background: #1a2e4a;
}

/* ── Shared centering stage for Scenes 1-3 ──
   Stretches from top:0 to bottom:180px (= 1080-180=900px cutoff).
   Flex-centers its single child — no CSS transform, GSAP safe.  */
.pi-verb-stage {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

/* ── h1-scale verb words ── */
.pi-verb {
  font-family: 'Instrument Sans', sans-serif;
  font-size: 4.2cqw;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.02em;
  text-align: center;
  white-space: nowrap;
  will-change: transform, opacity, filter;
}

#pi-s1 { color: #ffffff; }
#pi-s2 { color: #ffffff; }
#pi-s3 { color: #28c98a; }

/* ── Scene 4 stage ── */
.pi-s4-stage {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  pointer-events: none;
}

/* ── Hairline teal separator ── */
#pi-sep {
  width: 760px;
  height: 2px;
  background: #28c98a;
  transform-origin: center center;
  will-change: transform, opacity;
}

/* ── h2-scale product name ── */
#pi-text {
  font-family: 'Instrument Sans', sans-serif;
  font-size: 2.6cqw;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: #28c98a;
  text-align: center;
  display: flex;
  gap: 0.28em;
  align-items: baseline;
  will-change: transform;
}

/* Per-word wrappers for staggered reveal — must be block-level for transforms */
.pi-word {
  display: inline-block;
  will-change: transform, opacity;
}

/* Period gets its own span so the jitter target is isolated */
#pi-dot {
  display: inline-block;
  will-change: transform;
}
</style>

<!-- ================================================================== -->
<!--  Composition root                                                    -->
<!--  Scene onsets re-synced to the HeyGen voice word timings (line 03):  -->
<!--  Santralise 0.24 · Vizualise 1.44 · Maîtrise 2.68 · Oeil… 4.04       -->
<!--  (spoken text is phonetic; on-screen text stays "Centralise" etc.)   -->
<!--  Held to 7.8s so the wordmark stays through the narration tail.      -->
<!-- ================================================================== -->
<div id="root"
     data-composition-id="03-product-intro"
     data-duration="7.8"
     data-width="1920"
     data-height="1080">

  <!-- ── Track 0 · Navy ground (full duration) ── -->
  <div class="clip pi-bg"
       data-start="0"
       data-duration="7.8"
       data-track-index="0">
  </div>

  <!-- ── Track 1 · Scene 1 · "Centralise." (0.24–1.44s) ── -->
  <div class="clip pi-verb-stage"
       data-start="0"
       data-duration="1.44"
       data-track-index="1">
    <div id="pi-s1" class="pi-verb">Centralise.</div>
  </div>

  <!-- ── Track 2 · Scene 2 · "Visualise." (1.44–2.68s) ── -->
  <div class="clip pi-verb-stage"
       data-start="1.44"
       data-duration="1.24"
       data-track-index="2">
    <div id="pi-s2" class="pi-verb">Visualise.</div>
  </div>

  <!-- ── Track 3 · Scene 3 · "Maîtrise." (2.68–4.04s) ── -->
  <div class="clip pi-verb-stage"
       data-start="2.68"
       data-duration="1.36"
       data-track-index="3">
    <div id="pi-s3" class="pi-verb">Maîtrise.</div>
  </div>

  <!-- ── Track 4 · Scene 4 · "Oeil360 Finance." (4.04–7.8s) ── -->
  <div class="clip pi-s4-stage"
       data-start="4.04"
       data-duration="3.76"
       data-track-index="4">

    <!-- 2 px teal hairline separator -->
    <div id="pi-sep"></div>

    <!-- Product name — per-word staggered reveal -->
    <div id="pi-text">
      <span class="pi-word" id="pi-w1">Oeil360</span>
      <span class="pi-word" id="pi-w2">Finance<span id="pi-dot">.</span></span>
    </div>

  </div>

</div><!-- /#root -->

<!-- ================================================================== -->
<!--  GSAP (must live inside <template>)                                  -->
<!-- ================================================================== -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"
        integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2"
        crossorigin="anonymous"></script>
<script>
(function () {
  'use strict';

  window.__timelines = window.__timelines || {};

  /* ── Single paused timeline ── */
  const tl = gsap.timeline({ paused: true });

  /* ── ONE beat array — re-synced to the HeyGen voice (line 03) ── */
  const BEATS = [0.239, 1.439, 2.679, 4.039];   // spoken onsets: Santralise / Vizualise / Maîtrise / Oeil…

  /* ════════════════════════════════════════════════════════════════
     SCENE 1  ("Centralise." — spoken 0.28s)
     scale+blur slam, power4.out (hard slam / fast settle)
  ════════════════════════════════════════════════════════════════ */
  tl.fromTo(
    '#pi-s1',
    { scale: 1.5, filter: 'blur(18px)', autoAlpha: 0 },
    { scale: 1,   filter: 'blur(0px)',  autoAlpha: 1,
      duration: 0.5, ease: 'power4.out' },
    BEATS[0]
  );

  /* Hard-cut at the next spoken onset — instant snap to invisible */
  tl.set('#pi-s1', { autoAlpha: 0 }, BEATS[1]);

  /* ════════════════════════════════════════════════════════════════
     SCENE 2  ("Visualise." — spoken 1.86s)
     side whip from left, expo.out (hardest snap)
  ════════════════════════════════════════════════════════════════ */
  tl.fromTo(
    '#pi-s2',
    { x: -300, autoAlpha: 0 },
    { x: 0,    autoAlpha: 1,
      duration: 0.45, ease: 'expo.out' },
    BEATS[1]
  );

  /* Hard-cut at the next spoken onset */
  tl.set('#pi-s2', { autoAlpha: 0 }, BEATS[2]);

  /* ════════════════════════════════════════════════════════════════
     SCENE 3  ("Maîtrise." — spoken 3.36s)
     rise + tilt (circ.out — heavy rise with momentum). Teal = apex.
  ════════════════════════════════════════════════════════════════ */
  tl.fromTo(
    '#pi-s3',
    { y: 75, rotation: -3, autoAlpha: 0 },
    { y: 0,  rotation:  0, autoAlpha: 1,
      duration: 0.55, ease: 'circ.out' },
    BEATS[2]
  );

  /* Hard-cut at the product-name onset */
  tl.set('#pi-s3', { autoAlpha: 0 }, BEATS[3]);

  /* ════════════════════════════════════════════════════════════════
     SCENE 4  ("Oeil360 Finance." — spoken 4.74s)
     per-word staggered slide-up reveal
  ════════════════════════════════════════════════════════════════ */

  /* Hairline separator: scaleX reveal + fade */
  tl.fromTo(
    '#pi-sep',
    { scaleX: 0, autoAlpha: 0, transformOrigin: 'center center' },
    { scaleX: 1, autoAlpha: 1,
      duration: 0.35, ease: 'power2.out' },
    BEATS[3]
  );

  /* Per-word staggered slide-up: 30 px from below, 0.15 s between words */
  var words = ['#pi-w1', '#pi-w2'];
  words.forEach(function (sel, i) {
    tl.fromTo(
      sel,
      { y: 30, autoAlpha: 0 },
      { y: 0,  autoAlpha: 1,
        duration: 0.5, ease: 'power3.out' },
      BEATS[3] + 0.1 + i * 0.15
    );
  });

  /* ════════════════════════════════════════════════════════════════
     SINE-WAVE JITTER on the period "." (sine-wave-loop, 1 px)
     Starts after the wordmark settles (~5.6s), holds to the frame end.
  ════════════════════════════════════════════════════════════════ */
  var IDLE_START = 5.0;
  var IDLE_DUR   = 1.4;
  var CYCLES     = 0.8;

  var phase = { p: 0 };
  var dotEl = document.getElementById('pi-dot');

  tl.to(
    phase,
    {
      p: Math.PI * 2 * CYCLES,
      duration: IDLE_DUR,
      ease: 'none',
      onUpdate: function () {
        dotEl.style.transform = 'translateY(' + (Math.sin(phase.p) * 1).toFixed(3) + 'px)';
      }
    },
    IDLE_START
  );

  /* ── Register the single paused timeline ── */
  window.__timelines['03-product-intro'] = tl;
}());
</script>

</template>
