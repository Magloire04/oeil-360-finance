  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var winEl       = document.getElementById('t5-win');
      var jitterEl    = document.getElementById('t5-jitter');
      var state1      = document.getElementById('t5-state1');
      var state2      = document.getElementById('t5-state2');
      var state3      = document.getElementById('t5-state3');
      var revenuPill  = document.getElementById('t5-revenu-pill');
      var amountEl    = document.getElementById('t5-amount-val');
      var salaireTag  = document.getElementById('t5-salaire-tag');
      var rowIncome   = document.getElementById('t5-row-income');
      var rowTransport = document.getElementById('t5-row-transport');

      // ══════════════════════════════════════════════════════════════════════
      // SCENE 1 (0.0–2.0s)
      // App window enters from right: card-morph-anchor style
      // fromTo: x:200→0, scale:0.9→1, opacity:0→1
      // ══════════════════════════════════════════════════════════════════════

      tl.fromTo(
        winEl,
        { x: 200, scale: 0.9, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.7, ease: 'power2.out' },
        0
      );

      // Declare from-states for hidden layers immediately at build time.
      // These fromTo calls set opacity:0 on state2 and state3 synchronously
      // so seek at t=0 always finds them invisible.
      tl.fromTo(
        state2,
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: 'power2.out' },
        2.05
      );

      tl.fromTo(
        state3,
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: 'power2.out' },
        4.55
      );

      // ══════════════════════════════════════════════════════════════════════
      // SCENE 2 (2.0–4.5s)
      // Form appears: Revenu pill press-spring, amount typing, Salaire pop
      // ══════════════════════════════════════════════════════════════════════

      // Fade state 1 out
      tl.to(state1, { opacity: 0, duration: 0.25, ease: 'power1.out' }, 2.0);

      // press-release-spring on "Revenu" pill ──────────────────────────────
      // Press phase: linear compression (scale 1 → 0.95)
      tl.to(
        revenuPill,
        { scale: 0.95, duration: 0.15, ease: 'power1.in' },
        2.35
      );
      // Release phase: spring recovery with back.out overshoot (~1.05 → 1.0)
      // RELEASE_START = PRESS_START + PRESS_DUR = 2.35 + 0.15 = 2.50 ✓
      tl.to(
        revenuPill,
        { scale: 1, duration: 0.45, ease: 'back.out(1.7)' },
        2.50
      );

      // Amount character reveal — dynamic-content-sequencing driver ─────────
      // Driver tween advances t: 0 → string length; onUpdate slices the text.
      var amountStr = '350 000';
      var amountDriver = { t: 0 };
      tl.to(amountDriver, {
        t: amountStr.length,
        duration: 0.65,
        ease: 'none',
        onUpdate: function () {
          var n = Math.round(amountDriver.t);
          if (n < 0) { n = 0; }
          if (n > amountStr.length) { n = amountStr.length; }
          amountEl.textContent = amountStr.slice(0, n);
        }
      }, 2.75);

      // "Salaire" tag spring-pop-entrance ───────────────────────────────────
      // fromTo: scale:0,opacity:0,y:8 → scale:1,opacity:1,y:0 (power3.out)
      tl.fromTo(
        salaireTag,
        { scale: 0, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        3.50
      );

      // ══════════════════════════════════════════════════════════════════════
      // SCENE 3 (4.5–6.5s)
      // Transaction added: income row pops first, then transport row below
      // ══════════════════════════════════════════════════════════════════════

      // Fade state 2 out
      tl.to(state2, { opacity: 0, duration: 0.25, ease: 'power1.out' }, 4.5);

      // Income row +350 000 F CFA — spring-pop-entrance
      tl.fromTo(
        rowIncome,
        { scale: 0.85, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        4.80
      );

      // Transport row -15 000 F — spring-pop-entrance (staggered)
      tl.fromTo(
        rowTransport,
        { scale: 0.85, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        5.40
      );

      // ══════════════════════════════════════════════════════════════════════
      // SCENE 4 (6.5–8.0s)
      // Hold — sine-wave-loop jitter on the floating card (1px, 1.5s, 0.5 cycles)
      // Jitter is on #t5-jitter (outer wrapper) — separate from #t5-win which
      // GSAP already owns — so there is zero transform conflict.
      // sin(0) = 0 at phase start → no jump from settled state.
      // ══════════════════════════════════════════════════════════════════════

      var jitterPhase = { p: 0 };
      tl.to(jitterPhase, {
        p: Math.PI * 2 * 0.5,  // 0.5 full cycles (3 s period in 1.5 s window)
        duration: 1.5,
        ease: 'none',
        onUpdate: function () {
          var y = Math.sin(jitterPhase.p) * 1; // 1 px amplitude
          jitterEl.style.transform = 'translateY(' + y.toFixed(3) + 'px)';
        }
      }, 6.5);

      window.__timelines['05-transactions'] = tl;
    }());
  </script>
